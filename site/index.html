<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Market Pulse</title>
  <!-- Replaced by the app version on GitHub, so phones load new versions right away. -->
  <meta name="app-version" content="dev">
  <meta name="description" content="Personal market dashboard: watchlist, charts, news, YouTube and today's AI signals.">

  <!-- These lines make it installable on iPhone ("Add to Home Screen") -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Market Pulse">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">

  <link rel="stylesheet" href="styles.css?v=dev">
  <!-- Chart library by TradingView (free, open source, version 4.2.0, Apache-2.0) -->
  <script src="vendor/lightweight-charts.standalone.production.js" defer></script>
  <script src="symbols.js?v=dev" defer></script>
  <script src="app.js?v=dev" defer></script>
  <script src="calc.js?v=dev" defer></script>
</head>
<body>
  <!-- Opening animation: the app logo draws itself, then fades away (about 1.5 s, tap to skip). -->
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 192 192" class="splash-logo">
      <line class="base" x1="34" y1="153" x2="158" y2="153"/>
      <polyline class="pulse" points="34,128 68,98 96,116 126,72 157,49"/>
      <circle class="dot" cx="157" cy="49" r="11"/>
    </svg>
    <div class="splash-name">Market Pulse</div>
  </div>
  <header class="topbar">
    <div>
      <h1 id="page-title">Today</h1>
      <p class="sub"><span id="updated">Loading…</span> <span id="live-dot" class="live-dot" hidden>● LIVE</span></p>
    </div>
    <div class="top-actions">
      <a class="icon-btn bell" id="bell-btn" href="#/inbox" aria-label="Inbox">🔔<span class="bell-count" id="bell-count" hidden></span></a>
      <a class="icon-btn" id="settings-btn" href="#/settings" aria-label="Settings">⚙️</a>
      <button class="icon-btn" id="refresh" aria-label="Refresh">↻</button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/" data-tab="today"><span>☀️</span>Today</a>
    <a href="#/watchlist" data-tab="watchlist"><span>📈</span>Watchlist</a>
    <a href="#/compare" data-tab="compare"><span>⚖️</span>Compare</a>
    <a href="#/portfolio" data-tab="portfolio"><span>💼</span>Portfolio</a>
    <a href="#/news" data-tab="news"><span>📰</span>News</a>
    <a href="#/videos" data-tab="videos"><span>🎥</span>Videos</a>
    <a href="#/record" data-tab="record"><span>✅</span>Record</a>
  </nav>
</body>
</html>
