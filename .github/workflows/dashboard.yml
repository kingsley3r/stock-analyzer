name: Dashboard

# Rebuilds the dashboard data (prices, news, videos, today's digest) and
# publishes the website on GitHub Pages. AI is only used for the short summary
# in news alerts (a fraction of a cent per alert); the rest costs nothing.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes
  workflow_run:
    workflows: ["Morning digest"]
    types: [completed]          # right after the digest, so signals show up quickly
  push:
    branches: [main]
    paths: ["site/**", "analyzer/**", "config/**", ".github/workflows/dashboard.yml"]
  workflow_dispatch: {}

permissions:
  contents: write   # to save the track record on the 'track-record' branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get the saved track record
        uses: actions/checkout@v4
        with:
          ref: track-record
          path: record
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build dashboard data (encrypted with your password)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Only used for the short AI summary in news alerts.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: |
          # Stamp the app version into the page, so phones load new versions right away.
          export APP_VERSION="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=${APP_VERSION}/g; s/name=\"app-version\" content=\"dev\"/name=\"app-version\" content=\"${APP_VERSION}\"/" site/index.html
          grep -q "content=\"${APP_VERSION}\"" site/index.html
          # Never publish unlocked data: stop if the password secret is missing.
          if [ -z "$DASHBOARD_PASSWORD" ]; then
            echo "::error::Add a repository secret named DASHBOARD_PASSWORD (Settings > Secrets and variables > Actions). The dashboard is only published encrypted."
            exit 1
          fi
          python -m analyzer.dashboard_data
          # Double check: every data file must be encrypted.
          python -c "import json,pathlib,sys; bad=[str(p) for p in pathlib.Path('site/data').rglob('*.json') if p.name!='lock.json' and 'ct' not in json.loads(p.read_text())]; sys.exit('Unencrypted: '+', '.join(bad) if bad else 0)"
      - name: Save the track record and sent news alerts
        run: |
          cd record
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Track record update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
