name: Morning digest

on:
  schedule:
    # GitHub uses UTC. 02:40 UTC = 05:40 in Istanbul (UTC+3 all year).
    # GitHub often starts scheduled jobs 5-20 minutes late, and the run
    # takes a few minutes, so the message arrives around 06:00.
    - cron: "40 2 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for testing

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and send digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # Scheduled runs are a backup: they skip if your home computer already sent
        # today's digest. The "Run workflow" button always sends.
        run: python -m analyzer.digest ${{ github.event_name == 'schedule' && '--backup' || '' }}
      - name: Keep a copy of the digest and data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: output/
          retention-days: 30
