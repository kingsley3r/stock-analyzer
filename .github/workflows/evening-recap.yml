name: Evening recap

on:
  schedule:
    # GitHub uses UTC. 21:15 UTC = 00:15 Istanbul, right after the US close in winter
    # (in summer the US closes an hour earlier, so it arrives at about 00:15 too, an hour after).
    # Monday to Friday only. GitHub often starts scheduled jobs 5-20 minutes late.
    - cron: "15 21 * * 1-5"
  workflow_dispatch: {}   # "Run workflow" button for testing

permissions:
  contents: write   # to save the message in the inbox (track-record branch)

jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get the saved signals and earnings dates
        uses: actions/checkout@v4
        with:
          ref: track-record
          path: record
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Write the evening recap and notify your phone
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python -m analyzer.recap
      - name: Save it in the inbox
        if: always()
        run: |
          cd record
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -m "Evening recap $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have saved at the same moment: fetch its changes and try again.
          for i in 1 2 3 4; do git push && exit 0; sleep $((i * 5)); git pull --rebase; done
          exit 1
