timezone: Europe/Istanbul

ai:
  # claude-opus-5-5 gives the best analysis. To cut cost, try claude-sonnet-5-5
  # or claude-haiku-5-5 (much cheaper, less thorough).
  model: claude-opus-5-5
  effort: medium

telegram:
  # Telegram messages are limited to 4096 characters; longer digests are split.
  max_message_length: 4000

news_alerts:
  # Telegram alert when important news about a watchlist stock or coin comes in
  # (checked with every dashboard update, every 15 minutes). Free: no AI is used.
  enabled: true
  max_per_update: 3        # at most this many headlines per message
  window_minutes: 60       # only news from the last hour
  # Quiet time (Istanbul). You can change these in the app: ⚙️ Settings (saved to config/alerts.yaml).
  quiet_enabled: true
  quiet_from: "23:00"
  quiet_to: "07:00"
  quiet_mode: silent       # silent = arrive without sound, skip = not sent at all
  # Each alert gets a 1-3 sentence summary and the likely effect on the price (up/down),
  # written by Claude. Costs about $0.005 per alert message. Set ai_summary: false to turn off.
  style: B                 # A compact, B verdict first, C clean (all with buttons)
  ai_summary: true
  model: claude-opus-5-5   # claude-haiku-5-5 is ~40x cheaper, but less careful
  effort: low

price_alerts:
  # Defaults; change them in the app (⚙️ Settings and 🔔 on a stock's page).
  moves_enabled: true
  move_pct: 5              # alert when a stock moves more than this % in a day
  crypto_move_pct: 8       # ... or a coin moves more than this %

paper_trading:
  # Fake-money trading that follows the signals. See analyzer/paper.py.
  start_cash: 1000
  per_trade: 100
  stop_loss: 8             # sell when the price falls this % below the buy price
  take_profit: 15          # sell when the price rises this % above the buy price

earnings:
  enabled: true
  reminder_hour: 18        # Istanbul time, the evening before

evening_recap:
  enabled: true
  silent: true             # arrives without sound
